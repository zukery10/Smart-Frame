<!DOCTYPE html>
<html data-theme="dark">
<head>
<title>Dashboard</title>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="columns">
    <div class="column is-one-two-fifths">
        <div class="date-time has-text-centered">
            <h3 class="time" id="time"></h3>
            <div class="date" id="date"></div>
        </div>

    </div>   
    <div class="column" id="forecastHTML">
        <div class="columns" id="hourly"></div>
        <div class="columns" id="daily"></div>
    </div>
</div>

</body>
<script src="script.js"></script>
</html>
