<!DOCTYPE html>
<html data-theme="dark" >
<head>
<title>Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="black-translucent">
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="columns">
    <div class="column is-one-two-fifths" id="time-box">
        <div class="date-time has-text-centered">
            <h3 class="time" id="time"></h3>
            <div class="date" id="date"></div>
        </div>
        
    </div> 
      
    <div class="column" id="currentHTML">
        <div class="columns" id="hourly"></div>
         
    </div>
   
</div>

<div id="weekHTML">
    <div class="columns has-text-centered" id="daily">

    </div>
</div>
<div class="has-text-centered" id="factHTML"></div>



</body>
<script src="script.js"></script>
</html>
